[package]
name = "lumen-core"
version = "0.1.0"
edition = "2021"
description = "Ядро десктопного клиента Lumen: формат файлов, обход vault, индекс, синхронизация"
license = "MIT"

[lib]
name = "lumen_core"
# rlib for tests and the future CLI, cdylib for the flutter_rust_bridge binding.
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["clock"] }
walkdir = "2"
sha2 = "0.10"

[dev-dependencies]
