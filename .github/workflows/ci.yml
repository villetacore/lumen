# Открытый CI: проверки на каждый push и pull request, с main — образ в ghcr.io,
# с тега версии — образ с тегами версии и GitHub Release.
# Деплоя здесь нет: тег образа подхватывает пайплайн зеркала (docs/DEPLOY.md).
name: ci

on:
  push:
    branches: [main]
    # Точную проверку формата делает scripts/release-meta.sh: опечатка в теге
    # должна уронить прогон, а не молча его не запустить.
    tags: ["v[0-9]*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...

  # Те же тесты на настоящем PostgreSQL (ADR-0015): statetest даёт каждому свою схему.
  server-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lumen
          POSTGRES_PASSWORD: lumen
          POSTGRES_DB: lumen
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lumen" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      LUMEN_TEST_DATABASE_URL: postgres://lumen:lumen@127.0.0.1:5432/lumen?sslmode=disable
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go test -race ./internal/state/... ./internal/secretstore ./internal/people ./internal/notify ./internal/history ./internal/proposals ./internal/policy ./internal/service ./internal/httpapi

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test --if-present
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  # Какую версию вшить и какими тегами публиковать образ.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tags: ${{ steps.meta.outputs.tags }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      latest: ${{ steps.meta.outputs.latest }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Нужны все теги и origin/main.
          fetch-depth: 0
      - run: bash scripts/release-meta_test.sh
      - id: meta
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            # <sha12> — контракт с выкаткой: mirror:sync считает тот же тег из SHA.
            sha12=${GITHUB_SHA::12}
            printf 'version=%s\ntags=%s main\n' "$sha12" "$sha12" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Релиз только из main: версия не должна содержать непроверенный код.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME указывает на коммит вне main"
            exit 1
          fi
          git tag -l | bash scripts/release-meta.sh "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

  image:
    runs-on: ubuntu-latest
    needs: [version, server, server-postgres, web]
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: docker build
        run: docker build --build-arg VERSION="$VERSION" -t lumen:ci .
      - name: lumend version
        run: |
          got=$(docker run --rm lumen:ci version)
          if [ "$got" != "lumend $VERSION" ]; then
            echo "::error::lumend version показывает «$got», ждали «lumend $VERSION»"
            exit 1
          fi
      - name: smoke
        run: |
          docker run -d --name lumen -p 8787:8787 lumen:ci
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8787/healthz && exit 0
            sleep 1
          done
          docker logs lumen
          exit 1

  # Образ для всех. С main — ghcr.io/villetacore/lumen:<12 символов SHA> и :main,
  # с тега версии — :X.Y.Z и плавающие :X.Y, :X, :latest; <sha12> и :main тег не
  # трогает, у этого коммита они уже есть и в них вшит SHA.
  # Выкатку этот CI не делает — тег подхватывает пайплайн зеркала (docs/DEPLOY.md).
  publish:
    # push бывает только в main и в тег версии, см. on: выше.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [version, image, public-only]
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAGS: ${{ needs.version.outputs.tags }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push
        run: |
          img=ghcr.io/${GITHUB_REPOSITORY,,}
          # Опубликованная версия неизменна: повторный запуск ничего не пересобирает,
          # а перенесённый на другой коммит тег не заменит уже выпущенный образ.
          if [ "$GITHUB_REF_TYPE" = tag ] && docker pull -q "$img:$VERSION" >/dev/null 2>&1; then
            built=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$img:$VERSION")
            if [ "$built" != "$GITHUB_SHA" ]; then
              echo "::error::образ $VERSION уже выпущен из $built, тег сейчас на $GITHUB_SHA: выпустите следующую версию"
              exit 1
            fi
            echo "образ $VERSION уже опубликован"
            exit 0
          fi
          docker build --build-arg VERSION="$VERSION" \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.version="$VERSION" \
            --label org.opencontainers.image.licenses="$(head -1 LICENSE | grep -o -E 'MIT|Apache|GPL|AGPL|BSD' | head -1)" \
            -t lumen:publish .
          got=$(docker run --rm lumen:publish version)
          if [ "$got" != "lumend $VERSION" ]; then
            echo "::error::lumend version показывает «$got», ждали «lumend $VERSION»"
            exit 1
          fi
          for t in $TAGS; do
            docker tag lumen:publish "$img:$t"
            docker push "$img:$t"
          done

  # Заметки собирает GitHub из PR с прошлого релиза (разделы — .github/release.yml).
  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: [version, publish]
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
      LATEST: ${{ needs.version.outputs.latest }}
    steps:
      - name: github release
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "релиз $GITHUB_REF_NAME уже есть"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            --title "$GITHUB_REF_NAME" \
            --notes "Образ: \`ghcr.io/${GITHUB_REPOSITORY,,}:$VERSION\`" \
            --prerelease="$PRERELEASE" --latest="$LATEST"

  # Файлы пайплайна выкатки в открытый репозиторий не попадают.
  public-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: no private overlay files
        run: |
          for f in .gitlab-ci.yml .gitlab deploy; do
            if [ -e "$f" ]; then
              echo "::error::$f — файл пайплайна выкатки, ему здесь не место (docs/DEPLOY.md)"
              exit 1
            fi
          done
