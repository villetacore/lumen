# Открытый CI: проверки на каждый push и pull request. Деплоя здесь нет —
# сборку и выкатку делает приватная копия репозитория (docs/DEPLOY.md).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test --if-present
      - run: npm run build

  image:
    runs-on: ubuntu-latest
    needs: [server, web]
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build --build-arg VERSION="${GITHUB_SHA::12}" -t lumen:ci .
      - name: smoke
        run: |
          docker run -d --name lumen -p 8787:8787 lumen:ci
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8787/healthz && exit 0
            sleep 1
          done
          docker logs lumen
          exit 1

  # Образ для всех: ghcr.io/villetacore/lumen:<12 символов SHA> и :main.
  # Выкатку в homelab этот CI не делает — тег выбирает приватная копия (docs/DEPLOY.md).
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [image, public-only]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push
        run: |
          img=ghcr.io/${GITHUB_REPOSITORY,,}
          tag=${GITHUB_SHA::12}
          docker build --build-arg VERSION="$tag" \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.licenses="$(head -1 LICENSE | grep -o -E 'MIT|Apache|GPL|AGPL|BSD' | head -1)" \
            -t "$img:$tag" -t "$img:main" .
          docker push "$img:$tag"
          docker push "$img:main"

  # Файлы приватной копии (пайплайн выкатки) в открытый репозиторий не попадают.
  public-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no private overlay files
        run: |
          for f in .gitlab-ci.yml .gitlab deploy; do
            if [ -e "$f" ]; then
              echo "::error::$f принадлежит приватной копии, см. docs/DEPLOY.md"
              exit 1
            fi
          done
